[package]
name = "severnaya-yagoda-core"
version = "1.5.0"
edition = "2021"
publish = false

[[bin]]
name = "severnaya-yagoda-core"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
calamine = "0.38"
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
rust_xlsxwriter = "0.94"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
zip = { version = "7.4", default-features = false }
